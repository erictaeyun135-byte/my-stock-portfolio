<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- 👇 웹사이트를 스마트폰 앱처럼(주소창 없이 전체화면) 만들어주는 마법의 코드 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="포트폴리오">
  <meta name="theme-color" content="#1e1b4b">
  
  <title>CYBER PORTFOLIO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #000000);
      background-attachment: fixed;
      color: #e2e8f0;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }
    @keyframes flashUpDark {
      0% { background-color: rgba(248, 113, 113, 0.2); box-shadow: inset 0 0 15px rgba(248, 113, 113, 0.4); }
      100% { background-color: rgba(255, 255, 255, 0.05); box-shadow: none; }
    }
    @keyframes flashDownDark {
      0% { background-color: rgba(96, 165, 250, 0.2); box-shadow: inset 0 0 15px rgba(96, 165, 250, 0.4); }
      100% { background-color: rgba(255, 255, 255, 0.05); box-shadow: none; }
    }
    .flash-up { animation: flashUpDark 1s ease-out; }
    .flash-down { animation: flashDownDark 1s ease-out; }
    
    .cyber-input {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
    }
    .cyber-input:focus {
      outline: none;
      border-color: #818cf8;
      box-shadow: 0 0 10px rgba(129, 140, 248, 0.5);
    }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 max-w-2xl mx-auto space-y-5 font-sans">
  
  <div class="flex justify-between items-center mb-2">
    <h1 class="text-xl md:text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400 drop-shadow-sm">
      CYBER PORTFOLIO
    </h1>
    <div class="flex items-center space-x-1.5 bg-black/40 px-2.5 py-1 rounded-full border border-white/10">
      <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse shadow-[0_0_8px_#4ade80]"></div>
      <span id="status" class="text-[10px] font-bold text-green-400 tracking-widest">LIVE</span>
    </div>
  </div>
  
  <div class="glass-panel rounded-2xl p-5 grid grid-cols-2 md:grid-cols-3 gap-4 text-center items-center">
    <div class="col-span-2 md:col-span-1 border-b md:border-b-0 border-white/10 pb-3 md:pb-0">
      <span class="text-xs text-indigo-300 block font-semibold mb-1 tracking-wide">총 평가 금액</span>
      <span id="totalVal" class="text-xl md:text-2xl font-bold text-white drop-shadow-[0_0_8px_rgba(255,255,255,0.3)]">0 원</span>
    </div>
    <div>
      <span class="text-[10px] text-gray-400 block font-semibold mb-1">총 투자 원금</span>
      <span id="totalCost" class="text-sm md:text-base font-semibold text-gray-200">0 원</span>
    </div>
    <div>
      <span class="text-[10px] text-gray-400 block font-semibold mb-1">총 손익 / 수익률</span>
      <div id="totalProfitAmt" class="text-xs font-bold mt-0.5">0 원</div>
      <div id="totalProfit" class="text-sm md:text-base font-bold">0.00%</div>
    </div>
  </div>

  <div class="glass-panel rounded-2xl p-5 space-y-4">
    <div class="grid grid-cols-2 gap-3">
      <div class="col-span-2">
        <label class="text-[10px] font-semibold text-indigo-300 mb-1.5 block tracking-wider">STOCK NAME / TICKER</label>
        <input type="text" id="name" placeholder="종목명 (예: 삼성전자, AAPL)" class="cyber-input w-full p-2.5 rounded-lg text-sm transition-all">
      </div>
      <div>
        <label class="text-[10px] font-semibold text-indigo-300 mb-1.5 block tracking-wider">CURRENCY</label>
        <select id="currencyUnit" class="cyber-input w-full p-2.5 rounded-lg text-sm transition-all appearance-none">
          <option value="KRW" class="bg-gray-900 text-white">원화 (₩)</option>
          <option value="USD" class="bg-gray-900 text-white">달러 ($)</option>
        </select>
      </div>
      <div>
        <label class="text-[10px] font-semibold text-indigo-300 mb-1.5 block tracking-wider">QUANTITY</label>
        <input type="number" step="any" id="qty" placeholder="수량 (예: 10)" class="cyber-input w-full p-2.5 rounded-lg text-sm transition-all">
      </div>
      <div class="col-span-2">
        <label class="text-[10px] font-semibold text-indigo-300 mb-1.5 block tracking-wider">AVERAGE COST</label>
        <input type="number" step="any" id="price" placeholder="평단가 (예: 70000)" class="cyber-input w-full p-2.5 rounded-lg text-sm transition-all">
      </div>
    </div>
    <button onclick="addStock()" id="btn" class="w-full bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 text-white p-3 rounded-xl font-bold tracking-widest text-sm shadow-[0_0_15px_rgba(99,102,241,0.5)] transition-all">
      ADD ASSET +
    </button>
  </div>

  <div class="space-y-3">
    <div class="flex justify-between items-center px-1">
      <h2 class="font-bold text-gray-300 text-sm tracking-widest">ASSETS</h2>
      <span class="text-[10px] text-gray-500">SYNCED (5s)</span>
    </div>
    <div id="result" class="space-y-3"></div>
  </div>

  <script>
    let stocks = [];
    const aiState = {};

    async function loadStocksFromServer() {
      try {
        const res = await fetch('/api/portfolio');
        stocks = await res.json();
      } catch (err) {
        console.error("포트폴리오 불러오기 실패:", err);
      }
    }

    async function saveStocks() {
      try {
        await fetch('/api/portfolio', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(stocks)
        });
      } catch (err) {
        console.error("포트폴리오 저장 실패:", err);
      }
    }

    async function fetchStockInfo(queryName) {
      try {
        const res = await fetch(`/api/price?name=${encodeURIComponent(queryName)}`);
        const data = await res.json();
        if (data.error) return null;
        return data;
      } catch {
        return null;
      }
    }

    async function addStock() {
      const inputName = document.getElementById('name').value.trim();
      const inputPrice = parseFloat(document.getElementById('price').value);
      const inputQty = parseFloat(document.getElementById('qty').value);
      const inputCurrency = document.getElementById('currencyUnit').value;

      if (!inputName || isNaN(inputPrice) || isNaN(inputQty) || inputQty <= 0) {
        alert('모든 항목을 올바르게 입력해주세요.');
        return;
      }

      const btn = document.getElementById('btn');
      btn.innerText = 'LOADING...';
      btn.disabled = true;

      const result = await fetchStockInfo(inputName);
      
      btn.innerText = 'ADD ASSET +';
      btn.disabled = false;

      if (!result) {
        alert(`'${inputName}' 시세를 불러올 수 없습니다. 종목명/티커를 확인해주세요.`);
        return;
      }

      let buyPriceKRW = inputPrice;
      let buyPriceUSD = null;

      if (inputCurrency === 'USD') {
        buyPriceUSD = inputPrice;
        const rate = result.exchange_rate || 1350;
        buyPriceKRW = inputPrice * rate;
      }

      const officialName = result.name;
      const currentPriceKRW = result.price;
      const currentPriceUSD = result.price_usd || null;

      const existingIndex = stocks.findIndex(s => s.name.toLowerCase() === officialName.toLowerCase());

      if (existingIndex !== -1) {
        const existing = stocks[existingIndex];
        const totalCostKRW = (existing.buyPrice * existing.qty) + (buyPriceKRW * inputQty);
        const totalQty = existing.qty + inputQty;
        
        existing.name = officialName;
        existing.buyPrice = totalCostKRW / totalQty;
        if (inputCurrency === 'USD' && existing.buyPriceUSD) {
          existing.buyPriceUSD = ((existing.buyPriceUSD * existing.qty) + (buyPriceUSD * inputQty)) / totalQty;
        }
        existing.qty = totalQty;
        existing.currentPrice = currentPriceKRW;
        if (currentPriceUSD) existing.currentPriceUSD = currentPriceUSD;
      } else {
        stocks.push({ 
          name: officialName, 
          buyPrice: buyPriceKRW, 
          buyPriceUSD: buyPriceUSD,
          qty: inputQty, 
          currentPrice: currentPriceKRW,
          currentPriceUSD: currentPriceUSD,
          is_us: result.is_us || false
        });
      }
      
      document.getElementById('name').value = '';
      document.getElementById('price').value = '';
      document.getElementById('qty').value = '';

      saveStocks();
      render();
    }

    function editStock(index) {
      const stock = stocks[index];
      
      const newQtyInput = prompt(`[${stock.name}] 변경할 수량을 입력하세요:`, stock.qty);
      if (newQtyInput === null) return;
      
      const newQty = parseFloat(newQtyInput);
      if (isNaN(newQty) || newQty <= 0) {
        alert('유효한 수량을 입력해주세요.');
        return;
      }

      const defaultPrice = stock.buyPriceUSD ? stock.buyPriceUSD : Math.round(stock.buyPrice);
      const unitText = stock.buyPriceUSD ? '달러($)' : '원(₩)';
      
      const newPriceInput = prompt(`[${stock.name}] 변경할 매수 평단가를 입력하세요 (${unitText}):`, defaultPrice);
      if (newPriceInput === null) return;

      const newPrice = parseFloat(newPriceInput);
      if (isNaN(newPrice) || newPrice <= 0) {
        alert('유효한 단가를 입력해주세요.');
        return;
      }

      stock.qty = newQty;
      if (stock.buyPriceUSD) {
        stock.buyPriceUSD = newPrice;
        const currentRate = stock.currentPrice / stock.currentPriceUSD;
        stock.buyPrice = newPrice * currentRate;
      } else {
        stock.buyPrice = newPrice;
      }
      
      saveStocks();
      render();
    }

    function removeStock(index) {
      delete aiState[stocks[index].name];
      stocks.splice(index, 1);
      saveStocks();
      render();
    }

    async function toggleAiSummary(index) {
      const stock = stocks[index];
      
      if (!aiState[stock.name]) {
        aiState[stock.name] = { isOpen: false, isLoading: false, text: '' };
      }
      const state = aiState[stock.name];

      if (state.isOpen) {
        state.isOpen = false;
        render();
        return;
      }

      state.isOpen = true;

      if (state.text && !state.isLoading) {
        render();
        return;
      }

      state.isLoading = true;
      render(); 

      try {
        const queryName = stock.name.split(' (')[0];
        const res = await fetch(`/api/analyze?stock_name=${encodeURIComponent(queryName)}`);
        const data = await res.json();

        if (data.reason) {
          state.text = data.reason;
        } else {
          state.text = "Error fetching analysis.";
        }
      } catch (err) {
        state.text = "API 호출 실패: 백엔드 서버 확인 요망.";
      } finally {
        state.isLoading = false;
        render(); 
      }
    }

    function render() {
      const container = document.getElementById('result');
      container.innerHTML = '';

      if (stocks.length === 0) {
        container.innerHTML = '<div class="glass-panel rounded-xl py-8 text-center text-sm text-gray-500">보유 종목이 없습니다.</div>';
        document.getElementById('totalCost').innerText = '0 원';
        document.getElementById('totalVal').innerText = '0 원';
        document.getElementById('totalProfitAmt').innerText = '0 원';
        document.getElementById('totalProfitAmt').className = 'text-xs font-bold text-gray-400 mt-0.5';
        document.getElementById('totalProfit').innerText = '0.00%';
        document.getElementById('totalProfit').className = 'text-sm md:text-base font-bold text-gray-400';
        return;
      }

      let totalCost = 0;
      let totalValue = 0;

      stocks.forEach((s, index) => {
        const cost = s.buyPrice * s.qty;
        const val = s.currentPrice * s.qty;
        const profitAmt = val - cost;
        const profitRate = ((val - cost) / cost) * 100;

        totalCost += cost;
        totalValue += val;

        const buyPriceDisplay = s.buyPriceUSD 
          ? `$${s.buyPriceUSD.toFixed(2)} <span class="text-[10px] text-gray-500">(${Math.round(s.buyPrice).toLocaleString()}원)</span>` 
          : `${Math.round(s.buyPrice).toLocaleString()}원`;

        const currentPriceDisplay = s.currentPriceUSD 
          ? `$${s.currentPriceUSD.toFixed(2)} <span class="text-[10px] text-gray-500">(${Math.round(s.currentPrice).toLocaleString()}원)</span>` 
          : `${Math.round(s.currentPrice).toLocaleString()}원`;

        const profitAmtFormatted = `${profitAmt >= 0 ? '+' : ''}${Math.round(profitAmt).toLocaleString()}원`;
        const profitColor = profitRate >= 0 ? 'text-red-400 drop-shadow-[0_0_5px_rgba(248,113,113,0.5)]' : 'text-blue-400 drop-shadow-[0_0_5px_rgba(96,165,250,0.5)]';
        
        const flashClass = s._priceStatus === 'up' ? 'flash-up' : (s._priceStatus === 'down' ? 'flash-down' : 'glass-panel');

        const state = aiState[s.name] || { isOpen: false, isLoading: false, text: '' };
        
        let aiBoxHtml = '';
        if (state.isOpen) {
          if (state.isLoading) {
            aiBoxHtml = `
              <div class="mt-3 p-3 bg-indigo-900/40 border border-indigo-500/30 rounded-lg text-xs text-indigo-200">
                <div class="font-bold flex items-center gap-1.5 mb-1.5 text-indigo-300">
                  <div class="w-1.5 h-1.5 bg-indigo-400 rounded-full animate-ping"></div> AI ANALYZING...
                </div>
                <div class="animate-pulse text-[11px] text-indigo-200/60">최근 변동 원인을 스캔 중입니다...</div>
              </div>
            `;
          } else if (state.text) {
            aiBoxHtml = `
              <div class="mt-3 p-3 bg-indigo-900/40 border border-indigo-500/30 rounded-lg text-xs text-indigo-100">
                <div class="font-bold flex items-center gap-1.5 mb-1.5 text-indigo-300">
                  <span class="text-[14px]">🤖</span> AI INSIGHT
                </div>
                <div class="whitespace-pre-line leading-relaxed opacity-90">${state.text}</div>
              </div>
            `;
          }
        }

        container.innerHTML += `
          <div id="stock-item-${index}" class="rounded-xl p-4 text-sm transition-all ${flashClass}">
            <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-3">
              <div>
                <div class="font-extrabold text-white text-base flex items-center gap-2">
                  ${s.name} 
                  <span class="text-xs font-normal text-gray-400">(${s.qty}주)</span>
                  ${s.is_us ? '<span class="text-[9px] bg-indigo-500/30 text-indigo-200 px-1.5 py-0.5 rounded border border-indigo-500/50">US</span>' : ''}
                </div>
                <div class="text-xs text-gray-400 mt-1">AVG: <span class="text-gray-300">${buyPriceDisplay}</span></div>
              </div>
              
              <div class="flex flex-row md:flex-col justify-between items-end">
                <div class="text-left md:text-right">
                  <div class="text-xs text-gray-400 mb-0.5">NOW: <b class="text-white text-sm md:text-base">${currentPriceDisplay}</b></div>
                  <div class="text-xs">
                    <b class="${profitColor}">
                      ${profitRate >= 0 ? '+':''}${profitRate.toFixed(2)}% (${profitAmtFormatted})
                    </b>
                  </div>
                </div>
                
                <div class="flex items-center space-x-2 mt-0 md:mt-2">
                  <button id="ai-btn-${index}" onclick="toggleAiSummary(${index})" class="text-[11px] bg-indigo-600/20 hover:bg-indigo-600/50 text-indigo-300 border border-indigo-500/30 px-2.5 py-1.5 rounded-md transition font-bold tracking-wide">
                    AI 분석
                  </button>
                  <button onclick="editStock(${index})" class="text-[11px] bg-white/5 hover:bg-white/10 text-gray-300 border border-white/10 px-2.5 py-1.5 rounded-md transition">
                    수정
                  </button>
                  <button onclick="removeStock(${index})" class="text-[11px] bg-red-900/30 hover:bg-red-900/60 text-red-300 border border-red-900/50 px-2.5 py-1.5 rounded-md transition">
                    삭제
                  </button>
                </div>
              </div>
            </div>
            ${aiBoxHtml}
          </div>
        `;
        
        delete s._priceStatus;
      });

      const totalProfitAmt = totalValue - totalCost;
      const totalProfitRate = totalCost > 0 ? (totalProfitAmt / totalCost) * 100 : 0;
      
      document.getElementById('totalCost').innerText = `${Math.round(totalCost).toLocaleString()} 원`;
      document.getElementById('totalVal').innerText = `${Math.round(totalValue).toLocaleString()} 원`;
      
      const profitAmtEl = document.getElementById('totalProfitAmt');
      profitAmtEl.innerText = `${totalProfitAmt >= 0 ? '+' : ''}${Math.round(totalProfitAmt).toLocaleString()} 원`;
      
      const totalProfitEl = document.getElementById('totalProfit');
      totalProfitEl.innerText = `${totalProfitRate >= 0 ? '+' : ''}${totalProfitRate.toFixed(2)}%`;
      
      const tColor = totalProfitRate >= 0 ? 'text-red-400 drop-shadow-[0_0_8px_rgba(248,113,113,0.5)]' : 'text-blue-400 drop-shadow-[0_0_8px_rgba(96,165,250,0.5)]';
      profitAmtEl.className = `text-xs font-bold mt-0.5 ${tColor}`;
      totalProfitEl.className = `text-sm md:text-base font-bold ${tColor}`;
    }

    async function updateAllStocks() {
      if (stocks.length === 0) return;
      
      for (let s of stocks) {
        const query = s.ticker || s.name;
        const res = await fetchStockInfo(query);
        if (res) {
          const oldPrice = s.currentPrice;
          const newPrice = res.price;

          if (oldPrice && newPrice > oldPrice) {
            s._priceStatus = 'up';
          } else if (oldPrice && newPrice < oldPrice) {
            s._priceStatus = 'down';
          }

          s.currentPrice = newPrice;
          if (res.price_usd) s.currentPriceUSD = res.price_usd;
          
          if (s.buyPriceUSD && res.exchange_rate) {
            s.buyPrice = s.buyPriceUSD * res.exchange_rate;
          }
        }
      }
      saveStocks();
      render();
    }

    async function init() {
      await loadStocksFromServer();
      render();
      await updateAllStocks();
    }

    init();

    setInterval(updateAllStocks, 5000);
  </script>
</body>
</html>
