<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>실시간 주식 대시보드 (국내/해외)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes flashUp {
      0% { background-color: rgba(239, 68, 68, 0.25); }
      100% { background-color: transparent; }
    }
    @keyframes flashDown {
      0% { background-color: rgba(59, 130, 246, 0.25); }
      100% { background-color: transparent; }
    }
    .flash-up {
      animation: flashUp 1s ease-out;
    }
    .flash-down {
      animation: flashDown 1s ease-out;
    }
  </style>
</head>
<body class="bg-gray-100 p-6 max-w-xl mx-auto space-y-4">
  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-bold">📈 태윤의 주식 포트폴리오</h1>
    <span id="status" class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full font-bold">● 실시간 감시 중</span>
  </div>
  
  <div class="bg-white p-4 rounded-lg shadow grid grid-cols-3 gap-2 text-center items-center">
    <div>
      <span class="text-xs text-gray-400 block font-semibold">총 원금</span>
      <span id="totalCost" class="text-base font-bold text-gray-700">0 원</span>
    </div>
    <div>
      <span class="text-xs text-gray-400 block font-semibold">총 평가 금액</span>
      <span id="totalVal" class="text-base font-bold text-gray-800">0 원</span>
    </div>
    <div>
      <span class="text-xs text-gray-400 block font-semibold">총 손익 / 수익률</span>
      <div id="totalProfitAmt" class="text-xs font-bold text-gray-700 mt-0.5">0 원</div>
      <div id="totalProfit" class="text-base font-bold text-gray-800">0.00%</div>
    </div>
  </div>

  <div class="bg-white p-4 rounded-lg shadow space-y-3">
    <div>
      <label class="text-xs font-semibold text-gray-600 mb-1 block">종목명 (또는 티커/종목코드)</label>
      <input type="text" id="name" placeholder="예: 삼성전자, AAPL, TSLA, NVDA" class="w-full p-2 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div class="grid grid-cols-12 gap-2">
      <div class="col-span-3">
        <label class="text-xs font-semibold text-gray-600 mb-1 block">화폐 단위</label>
        <select id="currencyUnit" class="w-full p-2 border rounded text-sm bg-gray-50 focus:outline-none">
          <option value="KRW">원화 (₩)</option>
          <option value="USD">달러 ($)</option>
        </select>
      </div>
      <div class="col-span-5">
        <label class="text-xs font-semibold text-gray-600 mb-1 block">매수가 / 평단가</label>
        <input type="number" step="any" id="price" placeholder="예: 70000 또는 180.5" class="w-full p-2 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="col-span-4">
        <label class="text-xs font-semibold text-gray-600 mb-1 block">수량</label>
        <input type="number" step="any" id="qty" placeholder="10" class="w-full p-2 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
    </div>
    <button onclick="addStock()" id="btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded font-bold transition text-sm">
      종목 추가하기
    </button>
  </div>

  <div class="bg-white p-4 rounded-lg shadow space-y-2">
    <div class="flex justify-between items-center mb-2">
      <h2 class="font-bold text-gray-700 text-sm">보유 종목 현황</h2>
      <span class="text-xs text-gray-400">5초마다 자동 갱신</span>
    </div>
    <div id="result" class="space-y-2"></div>
  </div>

  <script>
    let stocks = JSON.parse(localStorage.getItem('my_portfolio_stocks')) || [];
    const aiState = {};

    function saveStocks() {
      localStorage.setItem('my_portfolio_stocks', JSON.stringify(stocks));
    }

    async function fetchStockInfo(queryName) {
      try {
        // 👇 클라우드 서버용으로 주소 변경됨
        const res = await fetch(`/api/price?name=${encodeURIComponent(queryName)}`);
        const data = await res.json();
        if (data.error) return null;
        return data;
      } catch {
        return null;
      }
    }

    async function addStock() {
      const inputName = document.getElementById('name').value.trim();
      const inputPrice = parseFloat(document.getElementById('price').value);
      const inputQty = parseFloat(document.getElementById('qty').value);
      const inputCurrency = document.getElementById('currencyUnit').value;

      if (!inputName || isNaN(inputPrice) || isNaN(inputQty) || inputQty <= 0) {
        alert('모든 항목을 올바르게 입력해주세요.');
        return;
      }

      const btn = document.getElementById('btn');
      btn.innerText = '시세 불러오는 중...';
      btn.disabled = true;

      const result = await fetchStockInfo(inputName);
      
      btn.innerText = '종목 추가하기';
      btn.disabled = false;

      if (!result) {
        alert(`'${inputName}' 시세를 불러올 수 없습니다. 종목명/티커를 확인해주세요.`);
        return;
      }

      let buyPriceKRW = inputPrice;
      let buyPriceUSD = null;

      if (inputCurrency === 'USD') {
        buyPriceUSD = inputPrice;
        const rate = result.exchange_rate || 1350;
        buyPriceKRW = inputPrice * rate;
      }

      const officialName = result.name;
      const currentPriceKRW = result.price;
      const currentPriceUSD = result.price_usd || null;

      const existingIndex = stocks.findIndex(s => s.name.toLowerCase() === officialName.toLowerCase());

      if (existingIndex !== -1) {
        const existing = stocks[existingIndex];
        const totalCostKRW = (existing.buyPrice * existing.qty) + (buyPriceKRW * inputQty);
        const totalQty = existing.qty + inputQty;
        
        existing.name = officialName;
        existing.buyPrice = totalCostKRW / totalQty;
        if (inputCurrency === 'USD' && existing.buyPriceUSD) {
          existing.buyPriceUSD = ((existing.buyPriceUSD * existing.qty) + (buyPriceUSD * inputQty)) / totalQty;
        }
        existing.qty = totalQty;
        existing.currentPrice = currentPriceKRW;
        if (currentPriceUSD) existing.currentPriceUSD = currentPriceUSD;
      } else {
        stocks.push({ 
          name: officialName, 
          buyPrice: buyPriceKRW, 
          buyPriceUSD: buyPriceUSD,
          qty: inputQty, 
          currentPrice: currentPriceKRW,
          currentPriceUSD: currentPriceUSD,
          is_us: result.is_us || false
        });
      }
      
      document.getElementById('name').value = '';
      document.getElementById('price').value = '';
      document.getElementById('qty').value = '';

      saveStocks();
      render();
    }

    function editStock(index) {
      const stock = stocks[index];
      
      const newQtyInput = prompt(`[${stock.name}] 변경할 수량을 입력하세요:`, stock.qty);
      if (newQtyInput === null) return;
      
      const newQty = parseFloat(newQtyInput);
      if (isNaN(newQty) || newQty <= 0) {
        alert('유효한 수량을 입력해주세요.');
        return;
      }

      const defaultPrice = stock.buyPriceUSD ? stock.buyPriceUSD : Math.round(stock.buyPrice);
      const unitText = stock.buyPriceUSD ? '달러($)' : '원(₩)';
      
      const newPriceInput = prompt(`[${stock.name}] 변경할 매수 평단가를 입력하세요 (${unitText}):`, defaultPrice);
      if (newPriceInput === null) return;

      const newPrice = parseFloat(newPriceInput);
      if (isNaN(newPrice) || newPrice <= 0) {
        alert('유효한 단가를 입력해주세요.');
        return;
      }

      stock.qty = newQty;
      if (stock.buyPriceUSD) {
        stock.buyPriceUSD = newPrice;
        const currentRate = stock.currentPrice / stock.currentPriceUSD;
        stock.buyPrice = newPrice * currentRate;
      } else {
        stock.buyPrice = newPrice;
      }
      
      saveStocks();
      render();
    }

    function removeStock(index) {
      delete aiState[stocks[index].name];
      stocks.splice(index, 1);
      saveStocks();
      render();
    }

    async function toggleAiSummary(index) {
      const stock = stocks[index];
      
      if (!aiState[stock.name]) {
        aiState[stock.name] = { isOpen: false, isLoading: false, text: '' };
      }
      const state = aiState[stock.name];

      if (state.isOpen) {
        state.isOpen = false;
        render();
        return;
      }

      state.isOpen = true;

      if (state.text && !state.isLoading) {
        render();
        return;
      }

      state.isLoading = true;
      render(); 

      try {
        const queryName = stock.name.split(' (')[0];
        // 👇 클라우드 서버용으로 주소 변경됨
        const res = await fetch(`/api/analyze?stock_name=${encodeURIComponent(queryName)}`);
        const data = await res.json();

        if (data.reason) {
          state.text = data.reason;
        } else {
          state.text = "분석 결과를 가져오지 못했습니다.";
        }
      } catch (err) {
        state.text = "AI 분석 호출 실패: 백엔드 서버를 확인해주세요.";
      } finally {
        state.isLoading = false;
        render(); 
      }
    }

    function render() {
      const container = document.getElementById('result');
      container.innerHTML = '';

      if (stocks.length === 0) {
        container.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">추가된 종목이 없습니다.</p>';
        document.getElementById('totalCost').innerText = '0 원';
        document.getElementById('totalVal').innerText = '0 원';
        document.getElementById('totalProfitAmt').innerText = '0 원';
        document.getElementById('totalProfitAmt').className = 'text-xs font-bold text-gray-700 mt-0.5';
        document.getElementById('totalProfit').innerText = '0.00%';
        document.getElementById('totalProfit').className = 'text-base font-bold text-gray-800';
        return;
      }

      let totalCost = 0;
      let totalValue = 0;

      stocks.forEach((s, index) => {
        const cost = s.buyPrice * s.qty;
        const val = s.currentPrice * s.qty;
        const profitAmt = val - cost;
        const profitRate = ((val - cost) / cost) * 100;

        totalCost += cost;
        totalValue += val;

        const buyPriceDisplay = s.buyPriceUSD 
          ? `$${s.buyPriceUSD.toFixed(2)} (약 ${Math.round(s.buyPrice).toLocaleString()}원)` 
          : `${Math.round(s.buyPrice).toLocaleString()}원`;

        const currentPriceDisplay = s.currentPriceUSD 
          ? `$${s.currentPriceUSD.toFixed(2)} <span class="text-xs text-gray-400">(${Math.round(s.currentPrice).toLocaleString()}원)</span>` 
          : `${Math.round(s.currentPrice).toLocaleString()}원`;

        const profitAmtFormatted = `${profitAmt >= 0 ? '+' : ''}${Math.round(profitAmt).toLocaleString()}원`;
        const flashClass = s._priceStatus === 'up' ? 'flash-up' : (s._priceStatus === 'down' ? 'flash-down' : '');

        const state = aiState[s.name] || { isOpen: false, isLoading: false, text: '' };
        
        let aiBoxHtml = '';
        if (state.isOpen) {
          if (state.isLoading) {
            aiBoxHtml = `
              <div class="font-bold text-purple-700 mb-1 flex items-center gap-1">🤖 AI 주가 변동 요약</div>
              <div class="text-gray-500 animate-pulse">최근 변동 원인을 분석하고 있습니다... (약 3~5초 소요)</div>
            `;
          } else if (state.text) {
            aiBoxHtml = `
              <div class="font-bold text-purple-700 mb-1 flex items-center gap-1">🤖 AI 주가 변동 요약</div>
              <div class="text-gray-700 whitespace-pre-line leading-relaxed">${state.text}</div>
            `;
          }
        }

        container.innerHTML += `
          <div id="stock-item-${index}" class="border-b pb-2 text-sm p-1 rounded transition-all ${flashClass}">
            <div class="flex justify-between items-center">
              <div>
                <div class="font-bold text-gray-800">
                  ${s.name} 
                  <span class="text-xs text-gray-500">(${s.qty}주)</span>
                  ${s.is_us ? '<span class="text-[10px] bg-blue-100 text-blue-600 px-1 rounded ml-1 font-normal">미국</span>' : ''}
                </div>
                <div class="text-xs text-gray-400">평단가: ${buyPriceDisplay}</div>
              </div>
              <div class="flex items-center space-x-1.5">
                <div class="text-right mr-1">
                  <div>현재가: <b>${currentPriceDisplay}</b></div>
                  <div class="text-xs">
                    손익: 
                    <b class="${profitRate >= 0 ? 'text-red-500':'text-blue-500'}">
                      ${profitRate >= 0 ? '+':''}${profitRate.toFixed(2)}% (${profitAmtFormatted})
                    </b>
                  </div>
                </div>
                <button id="ai-btn-${index}" onclick="toggleAiSummary(${index})" class="text-xs bg-purple-50 hover:bg-purple-600 hover:text-white text-purple-700 border border-purple-200 px-2 py-1 rounded transition font-semibold">
                  💡 이유
                </button>
                <button onclick="editStock(${index})" class="text-xs bg-gray-100 hover:bg-blue-500 hover:text-white text-gray-600 px-2 py-1 rounded transition">
                  수정
                </button>
                <button onclick="removeStock(${index})" class="text-xs bg-gray-100 hover:bg-red-500 hover:text-white text-gray-500 px-2 py-1 rounded transition">
                  삭제
                </button>
              </div>
            </div>
            <div id="ai-box-${index}" class="${state.isOpen ? '' : 'hidden'} mt-2 p-2.5 bg-purple-50 border border-purple-200 rounded text-xs text-gray-700">
              ${aiBoxHtml}
            </div>
          </div>
        `;
        
        delete s._priceStatus;
      });

      const totalProfitAmt = totalValue - totalCost;
      const totalProfitRate = totalCost > 0 ? (totalProfitAmt / totalCost) * 100 : 0;
      
      document.getElementById('totalCost').innerText = `${Math.round(totalCost).toLocaleString()} 원`;
      document.getElementById('totalVal').innerText = `${Math.round(totalValue).toLocaleString()} 원`;
      
      const profitAmtEl = document.getElementById('totalProfitAmt');
      profitAmtEl.innerText = `${totalProfitAmt >= 0 ? '+' : ''}${Math.round(totalProfitAmt).toLocaleString()} 원`;
      profitAmtEl.className = `text-xs font-bold mt-0.5 ${totalProfitAmt >= 0 ? 'text-red-500' : 'text-blue-500'}`;

      const totalProfitEl = document.getElementById('totalProfit');
      totalProfitEl.innerText = `${totalProfitRate >= 0 ? '+' : ''}${totalProfitRate.toFixed(2)}%`;
      totalProfitEl.className = `text-base font-bold ${totalProfitRate >= 0 ? 'text-red-500' : 'text-blue-500'}`;
    }

    async function updateAllStocks() {
      if (stocks.length === 0) return;
      
      for (let s of stocks) {
        const query = s.ticker || s.name;
        const res = await fetchStockInfo(query);
        if (res) {
          const oldPrice = s.currentPrice;
          const newPrice = res.price;

          if (oldPrice && newPrice > oldPrice) {
            s._priceStatus = 'up';
          } else if (oldPrice && newPrice < oldPrice) {
            s._priceStatus = 'down';
          }

          s.currentPrice = newPrice;
          if (res.price_usd) s.currentPriceUSD = res.price_usd;
          
          if (s.buyPriceUSD && res.exchange_rate) {
            s.buyPrice = s.buyPriceUSD * res.exchange_rate;
          }
        }
      }
      saveStocks();
      render();
    }

    async function init() {
      render();
      await updateAllStocks();
    }

    init();

    setInterval(updateAllStocks, 5000);
  </script>
</body>
</html>
